[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ocr-starter"
version = "0.1.0"
description = "Starter project for OCR on PDF files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF==1.25.3",
  "pytesseract==0.3.13",
  "Pillow==11.1.0",
  "streamlit==1.42.2",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ocr_pdf*"]
